name: Deploy GitHub Pages

# DOS JOBS A PROPÓSITO. Con un solo job, «Re-run jobs» rehace también la subida
# del artefacto y deja DOS llamados «github-pages» en la misma ejecución; a
# partir de ahí deploy-pages no sabe cuál publicar y la ejecución queda
# envenenada (pasó el 2026-10-16). Separando build de deploy, «Re-run failed
# jobs» relanza solo el deploy y reutiliza el artefacto que ya existe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Fijado a 24.04: ubuntu-latest migra a Ubuntu 26 el 19 de octubre de 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Por defecto son 10 min y la cola de Pages los supera a menudo
          # (2026-10-16: «Timeout reached, aborting!» a los 10m 14s).
          timeout: 1800000
